<!doctype html>
<!--
  WebKit bug repro: a face added through the CSS Font Loading API is measured but not drawn by a 2D canvas.
  Seen in Safari 27.2 on macOS 15 (three-viewport-gizmo P13 cross-browser run 45648160677); Chromium and Firefox pass.
  Open over http (any static server; the font file must be same-origin or CORS-enabled) and read the output line.
  Steps: new FontFace(name, url(...)), document.fonts.add(face), await face.load(); then on a fresh canvas compare
  measureText and fillText in `40px Repro, serif` against `40px serif`.
  Expected: measured widths differ AND drawn pixels differ (the canvas draws in the loaded face).
  Actual (Safari 27.2): widths differ (measureText uses the face) but the toDataURL images are identical
  (fillText draws with the fallback), at weight 400 and 900.
-->
<meta charset="utf-8" />
<title>WebKit: FontFace API face drawn with fallback in 2D canvas</title>
<pre id="out">running…</pre>
<script type="module">
  const face = new FontFace("Repro", "url(../fixtures/geist-latin.woff2)");
  document.fonts.add(face);
  await face.load();
  const run = (font) => {
    const c = Object.assign(document.createElement("canvas"), { width: 200, height: 60 });
    const x = c.getContext("2d");
    x.font = font;
    x.fillText("Front", 4, 45);
    return { width: x.measureText("Front").width, image: c.toDataURL() };
  };
  const face40 = run("40px Repro, serif"), fallback = run("40px serif");
  const measured = face40.width !== fallback.width, drawn = face40.image !== fallback.image;
  document.getElementById("out").textContent = `measured in face: ${measured}, drawn in face: ${drawn} → ${measured && drawn ? "PASS" : "BUG"}`;
</script>
